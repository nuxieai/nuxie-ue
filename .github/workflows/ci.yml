name: SDK validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/nuxie/bazel
            ~/.cache/nuxie-tools/bazelisk
          key: bazel-${{ runner.os }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock') }}
          restore-keys: bazel-${{ runner.os }}-
      - name: Execute portable request lifecycle tests
        env:
          NUXIE_BAZEL_BATCH: "1"
        run: python3 scripts/bazel/sdk.py test
# Full native and Unreal qualification runs on the licensed local toolchain through scripts/check.py.
