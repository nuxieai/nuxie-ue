name: SDK validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute portable request lifecycle tests
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror -fsanitize=address,undefined Tests/request-ledger.cpp -o /tmp/nuxie-contract
          /tmp/nuxie-contract
# Full native and Unreal qualification runs on the licensed local toolchain through scripts/check.py.
